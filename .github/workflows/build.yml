name: Build

on:
  push:
    tags:
      - 'v*'  # Only on version tags like v0.0.3
  workflow_dispatch:  # Manual trigger from GitHub UI
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - macos
          - windows

jobs:
  build-linux:
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            autoconf automake libtool \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libasound2-dev \
            libportaudio2 portaudio19-dev \
            libsndfile1-dev \
            libfreetype6-dev

      - name: Build prerequisites (glyphy, etc.)
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBuildPrerequisites=ON
          make -j$(nproc)

      - name: Build goban
        run: |
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBuildPrerequisites=OFF
          make -j$(nproc)

      # A release that fails its own tests should not be published. Linux only:
      # the suite is the same everywhere and this is the platform that can run it
      # without a display.
      - name: Run tests
        run: cd build && ctest --output-on-failure --timeout 120

      - name: Package
        run: python3 tools/package.py --binary build/goban --platform linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: goban-linux-x64
          path: dist/*.tar.gz

  build-macos:
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool
          brew install portaudio libsndfile

      - name: Build prerequisites (glyphy, etc.)
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBuildPrerequisites=ON
          make -j$(sysctl -n hw.ncpu)

      - name: Build goban
        run: |
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBuildPrerequisites=OFF
          make -j$(sysctl -n hw.ncpu)

      - name: Package
        run: python3 tools/package.py --binary build/goban --platform macos-x64

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: goban-macos-x64
          path: dist/*.tar.gz

  build-windows:
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows' }}
    runs-on: windows-latest
    strategy:
      # Without this a failure in one architecture cancels the other, so x86 has
      # never once completed: x64 failed first every time and took it with it.
      # The two are independent artifacts and each is worth knowing about.
      fail-fast: false
      matrix:
        arch: [x86, x64]
        include:
          - arch: x86
            cmake_arch: Win32
            triplet: x86-windows-static
          - arch: x64
            cmake_arch: x64
            triplet: x64-windows-static
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies via vcpkg
        run: vcpkg install freetype portaudio libsndfile --triplet ${{ matrix.triplet }}

      - name: Build prerequisites
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake .. -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release -DBuildPrerequisites=ON -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build . --config Release --verbose

      - name: Build goban
        shell: cmd
        run: |
          cd build
          cmake .. -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release -DBuildPrerequisites=OFF -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build . --config Release

      - name: Package
        shell: bash
        run: |
          exe=$(find build -name goban.exe | head -1)
          python tools/package.py --binary "$exe" --platform windows-${{ matrix.arch }}

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: goban-windows-${{ matrix.arch }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The tag and the version compiled into the About dialog must agree. They
      # are set in two different places by two different hands, and a release
      # whose binary reports a different number than its own tag is not
      # something anyone can debug from a bug report.
      - name: Check the tag matches CMakeLists
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(sed -n 's/.*project(goban.*VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "tag=$tag  CMakeLists=$proj"
          if [ "$tag" != "$proj" ]; then
            echo "::error::tag v$tag does not match PROJECT_VERSION $proj"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: RELEASE_NOTES.md
          draft: false
